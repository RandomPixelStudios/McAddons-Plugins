name: Publish index
on:
  push:
    branches: [main]
    paths: ["plugins/**", "scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: index
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.2
      - run: python3 scripts/build_index.py --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA"
      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || git commit -m "Update index.json [skip ci]"
          git push
