name: Validate plugins
on:
  pull_request:
    paths: ["plugins/**", "scripts/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.2
      - run: python3 scripts/build_index.py --check
